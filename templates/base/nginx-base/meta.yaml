name: nginx-base
type: base
state: draft
description: Base NGINX config for nginx-config-automation instance groups.
files:
  - source: base.tmpl
  - source: main.json
  - source: http.json
  - source: README.md
  - source: aux/etc/nginx/mime.types
    target: /etc/nginx/mime.types
  - source: aux/etc/nginx/certs/nim-ca.pem
    target: /etc/nginx/certs/nim-ca.pem
