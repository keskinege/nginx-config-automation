user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout 65;

    # Pulls in conf.d/site.conf from this repo AND the Plus API listener that
    # ships inside the image (plus-api.conf on 127.0.0.1:9000). Do not remove:
    # without it the NGINX Agent loses Plus metrics and live activity.
    include /etc/nginx/conf.d/*.conf;
}

# Usage reporting to the instance manager. `mgmt` is a MAIN-context block
# (a sibling of events/http, not an http directive). A publish that drops this
# block makes the instance disappear from NIM. The endpoint is replaced from
# NIM_MGMT_ENDPOINT at publish time.
mgmt {
    usage_report endpoint=nim-mgmt-endpoint.invalid;
    enforce_initial_report off;
    ssl_verify on;
    ssl_trusted_certificate /etc/nginx/certs/nim-ca.pem;
    # The served leaf is CN=manager-server; the mgmt endpoint is a different
    # name, so verification has to use the SAN rather than the URL host.
    ssl_name manager-server;
}
