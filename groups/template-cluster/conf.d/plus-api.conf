# NGINX Plus API on loopback only, so nginx-agent can read metrics and the
# live-activity dashboard works. Same file the VM template writes.
server {
    listen 127.0.0.1:9000;
    location /api/ {
        api write=on;
        allow 127.0.0.1;
        deny all;
    }
    location = /dashboard.html {
        root /usr/share/nginx/html;
    }
}
