# Retained for the template deploy path; inactive while deploy_mode: static.
baseData:
  templateName: nginx-base
  main:
    templateInput:
      worker_connections: "2048"
      keepalive_timeout: "70"
      require_mgmt: true
      mgmt_endpoint: nim-mgmt-endpoint.invalid
      include_tls: false
  http:
    templateInput:
      access_log: /var/log/nginx/access.log
augmentData:
  - templateName: site-docker
    action: new
