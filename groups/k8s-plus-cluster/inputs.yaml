baseData:
  templateName: nginx-base
  main:
    templateInput:
      worker_connections: "1024"
      keepalive_timeout: "80"
      require_mgmt: true
      mgmt_endpoint: nim-mgmt-endpoint.invalid
      include_tls: true
  http:
    templateInput:
      access_log: /var/log/nginx/access.log
augmentData:
  - templateName: site-k8s
    action: new
