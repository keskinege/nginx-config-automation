user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout 65;

    # Plus API on 127.0.0.1:9000. DO NOT REMOVE: the agent reads metrics
    # and the live-activity dashboard from it.
    include /etc/nginx/conf.d/*.conf;

    server {
        listen 80 default_server;
        server_name _;
        location / {
            return 200 "plus-k8s seed config (http)\n";
        }
    }

    # Per-instance TLS is NOT in this file: a NIM instance-group config must
    # be identical for every member, and a certificate is not. The 443 server
    # lives in /etc/nginx-tls/server.conf, outside the directory the agent
    # manages, and this include drags it in. It must survive every publish.
    include /etc/nginx-tls/server.conf;
}

# Registration with the DR instance manager. `mgmt` is MAIN context - a
# sibling of events/http, not an http directive. Dropping it unregisters
# the instance from NIM. The endpoint is replaced from NIM_MGMT_ENDPOINT
# at publish time.
mgmt {
    usage_report endpoint=nim-mgmt-endpoint.invalid;
    enforce_initial_report off;
    ssl_verify off;
}

