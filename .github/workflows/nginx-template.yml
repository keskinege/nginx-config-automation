name: nginx-template

on:
  push:
    branches: [main]
    paths:
      - "templates/**"
      - "groups/**/inputs.yaml"
      - "groups/**/group.yaml"
      - ".nim/**"
      - "scripts/**"
      - ".github/workflows/nginx-template.yml"
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    name: check live drift
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: nim
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-yq
      - name: drift every group
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          NIM_MGMT_ENDPOINT: ${{ secrets.NIM_MGMT_ENDPOINT }}
        run: |
          rc=0
          for g in $(./scripts/list-groups.sh); do
            GROUP="$g" ./scripts/check-live-drift.sh || rc=1
          done
          ./scripts/check-nim-agents.sh || rc=1
          exit "$rc"
      - name: open or update the drift issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          body="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          num=$(gh issue list --search 'NIM drift detected in:title' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "New failure: $body"
          else
            gh issue create --title "NIM drift detected" --body "$body"
          fi

  changed:
    name: detect changed template groups
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.detect.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-yq

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          g=$(./scripts/detect-groups.sh template "$BEFORE" "$SHA" "$EVENT")
          json=$(printf '%s\n' "$g" | jq -R . | jq -cs .)
          echo "groups=$json" >> "$GITHUB_OUTPUT"
          echo "template groups to publish: $json"

  publish:
    name: publish ${{ matrix.group }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: changed
    runs-on: ubuntu-latest
    environment: nim
    concurrency:
      group: nim-group-${{ matrix.group }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: ${{ fromJSON(needs.changed.outputs.groups) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: matrix.group != '-'

      - uses: ./.github/actions/setup-yq
        if: matrix.group != '-'

      - name: map the NIM name
        if: matrix.group != '-'
        run: echo "${{ secrets.NIM_HOST }} manager-server" | sudo tee -a /etc/hosts

      - name: verify templates match NIM
        if: matrix.group != '-'
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
        run: python3 scripts/sync_templates.py --all --check

      - name: back up the config currently live on the group
        if: matrix.group != '-'
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          NIM_MGMT_ENDPOINT: ${{ secrets.NIM_MGMT_ENDPOINT }}
          GROUP: ${{ matrix.group }}
          OUT_DIR: backup/${{ matrix.group }}
          EXTERNAL_ID: ${{ github.sha }}
        run: ./scripts/backup-config.sh

      - name: upload backup artifact
        if: matrix.group != '-'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nim-group-config-backup-${{ matrix.group }}-${{ github.run_id }}
          path: backup/${{ matrix.group }}
          retention-days: 7
          if-no-files-found: error

      - name: render from templates
        if: matrix.group != '-'
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          NIM_MGMT_ENDPOINT: ${{ secrets.NIM_MGMT_ENDPOINT }}
          GROUP: ${{ matrix.group }}
          OUT_DIR: rendered/${{ matrix.group }}
          CHECK_HASH: "1"
          HASH_FILE: .nim/rendered.lock.json
        run: ./scripts/render.sh

      - uses: ./.github/actions/setup-plus-registry
        if: matrix.group != '-'
        with:
          crt: ${{ secrets.NGINX_REPO_CRT }}
          key: ${{ secrets.NGINX_REPO_KEY }}

      - name: lint and nginx -t on the rendered tree
        if: matrix.group != '-'
        env:
          NGINX_PLUS_JWT: ${{ secrets.NGINX_PLUS_JWT }}
        run: |
          ./scripts/lint.sh --rendered "${{ matrix.group }}"
          ./scripts/nginx-test-dir.sh "rendered/${{ matrix.group }}"

      - name: publish with externalId = commit sha
        if: matrix.group != '-'
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          GROUP: ${{ matrix.group }}
          CONFIG_DIR: rendered/${{ matrix.group }}
          EXTERNAL_ID: ${{ github.sha }}
          PRESERVE_AUX: "1"
        run: ./scripts/publish.sh
