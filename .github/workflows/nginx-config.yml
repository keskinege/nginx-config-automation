name: nginx-config

on:
  pull_request:
    paths: ["config/**", "scripts/**", ".github/workflows/**"]
  push:
    branches: [main]
    paths: ["config/**", "scripts/**", ".github/workflows/**"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nginx-config-publish
  cancel-in-progress: false

jobs:
  lint:
    name: lint + nginx -t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: lint invariants
        run: ./scripts/lint.sh

      - name: nginx -t (OSS; Plus-only block stripped)
        run: ./scripts/nginx-test.sh

  publish:
    name: publish to instance group
    # PRs never publish; merge to main (or a manual run) does.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: lint
    runs-on: ubuntu-latest
    environment: nim
    steps:
      - uses: actions/checkout@v4

      - name: publish config tree with externalId = commit sha
        env:
          NIM_URL: ${{ vars.NIM_URL }}
          NIM_GROUP: ${{ vars.NIM_INSTANCE_GROUP }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          EXTERNAL_ID: ${{ github.sha }}
        run: ./scripts/publish.sh
