name: nginx-config

on:
  pull_request:
    paths:
      - "groups/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "docs/**"
      - "README.md"
      - "requirements-dev.txt"
      - "pytest.ini"
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - "groups/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "requirements-dev.txt"
      - "pytest.ini"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: lint + nginx -t
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install dev dependencies
        run: pip install -r requirements-dev.txt

      - name: install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: pytest
        run: pytest -q

      - name: lint every static group
        run: ./scripts/lint.sh

      - name: nginx -t for every static group (OSS; Plus block stripped)
        run: ./scripts/nginx-test.sh

      - name: actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  changed:
    name: detect changed static groups
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.detect.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = workflow_dispatch ] || [ -z "$BEFORE" ] || \
             [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            g=$(./scripts/list-groups.sh static)
          else
            changed=$(git diff --name-only "$BEFORE" "$SHA" -- groups/ | cut -d/ -f2 | sort -u)
            # shellcheck disable=SC2086
            g=$(for d in $changed; do
                  mode=$(yq -r '.deploy_mode // "static"' "groups/$d/group.yaml" 2>/dev/null || echo static)
                  if [ "$mode" = static ]; then echo "$d"; fi
                done)
          fi
          [ -z "$g" ] && g="-"
          json=$(printf '%s\n' "$g" | jq -R . | jq -cs .)
          echo "groups=$json" >> "$GITHUB_OUTPUT"
          echo "static groups to publish: $json"

  publish:
    name: publish ${{ matrix.group }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [lint, changed]
    runs-on: ubuntu-latest
    environment: nim
    concurrency:
      group: nim-group-${{ matrix.group }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: ${{ fromJSON(needs.changed.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
        if: matrix.group != '-'

      - name: back up the config currently live on the group
        if: matrix.group != '-'
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          GROUP: ${{ matrix.group }}
          OUT_DIR: backup/${{ matrix.group }}
          EXTERNAL_ID: ${{ github.sha }}
        run: ./scripts/backup-config.sh

      - name: upload backup artifact
        if: matrix.group != '-'
        uses: actions/upload-artifact@v4
        with:
          name: nim-group-config-backup-${{ matrix.group }}-${{ github.run_id }}
          path: backup/${{ matrix.group }}
          retention-days: 90
          if-no-files-found: error

      - name: publish group tree with externalId = commit sha
        if: matrix.group != '-'
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          GROUP: ${{ matrix.group }}
          EXTERNAL_ID: ${{ github.sha }}
          PRESERVE_AUX: "1"
        run: ./scripts/publish.sh
