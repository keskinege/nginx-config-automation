name: nginx-static

on:
  push:
    branches: [main]
    paths:
      - "groups/**"
      - "scripts/**"
      - "tests/**"
      - "templates/**"
      - "requirements-dev.txt"
      - "pytest.ini"
      - ".github/workflows/**"
  workflow_dispatch:
    inputs:
      allow_partial:
        description: "Accept a publish where some members never report an outcome"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  changed:
    name: detect changed static groups
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.detect.outputs.groups }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-yq

      - id: detect
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          g=$(./scripts/detect-groups.sh static "$BEFORE" "$SHA" "$EVENT")
          json=$(printf '%s\n' "$g" | jq -R . | jq -cs .)
          echo "groups=$json" >> "$GITHUB_OUTPUT"
          echo "static groups to publish: $json"

  publish:
    name: publish ${{ matrix.group }}
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: [changed]
    runs-on: ubuntu-latest
    environment: nim
    concurrency:
      group: nim-group-${{ matrix.group }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        group: ${{ fromJSON(needs.changed.outputs.groups) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        if: matrix.group != '-'

      - uses: ./.github/actions/setup-yq
        if: matrix.group != '-'

      - uses: ./.github/actions/setup-plus-registry
        if: matrix.group != '-'
        with:
          crt: ${{ secrets.NGINX_REPO_CRT }}
          key: ${{ secrets.NGINX_REPO_KEY }}

      - name: validate the tree before publishing
        if: matrix.group != '-'
        env:
          NGINX_PLUS_JWT: ${{ secrets.NGINX_PLUS_JWT }}
        run: |
          set -euo pipefail
          ./scripts/lint.sh --group "${{ matrix.group }}"
          ./scripts/nginx-test-dir.sh "groups/${{ matrix.group }}"

      - name: back up the config currently live on the group
        if: matrix.group != '-'
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          NIM_MGMT_ENDPOINT: ${{ secrets.NIM_MGMT_ENDPOINT }}
          GROUP: ${{ matrix.group }}
          OUT_DIR: backup/${{ matrix.group }}
          EXTERNAL_ID: ${{ github.sha }}
        run: ./scripts/backup-config.sh

      - name: upload backup artifact
        if: matrix.group != '-'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nim-group-config-backup-${{ matrix.group }}-${{ github.run_id }}
          path: backup/${{ matrix.group }}
          retention-days: 7
          if-no-files-found: error

      - name: publish group tree with externalId = commit sha
        if: matrix.group != '-'
        env:
          ALLOW_PARTIAL: ${{ inputs.allow_partial && '1' || '0' }}
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          NIM_MGMT_ENDPOINT: ${{ secrets.NIM_MGMT_ENDPOINT }}
          GROUP: ${{ matrix.group }}
          EXTERNAL_ID: ${{ github.sha }}
          PRESERVE_AUX: "1"
        run: ./scripts/publish.sh
