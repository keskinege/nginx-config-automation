name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    outputs:
      static_changed: ${{ steps.changed.outputs.static }}
      template_changed: ${{ steps.changed.outputs.template }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-yq
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: ./scripts/lint.sh
      - id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            static=true; template=true
          elif ! diff=$(git diff --name-only "$base" "$GITHUB_SHA"); then
            static=true; template=true
          else
            if printf '%s\n' "$diff" | grep -qE '^(groups/static-cluster/|scripts/|requirements-dev.txt|pytest.ini|\.github/)'; then
              static=true
            else
              static=false
            fi
            if printf '%s\n' "$diff" | grep -qE '^(templates/|\.nim/|scripts/|groups/[^/]+/(inputs|group)\.yaml)'; then
              template=true
            else
              template=false
            fi
          fi
          echo "static=$static" >> "$GITHUB_OUTPUT"
          echo "template=$template" >> "$GITHUB_OUTPUT"
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  static:
    name: static validation
    needs: checks
    if: needs.checks.outputs.static_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-yq
      - run: ./scripts/nginx-test.sh

  template:
    name: template validation
    needs: checks
    if: needs.checks.outputs.template_changed == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-yq
      - run: pip install -r requirements-dev.txt
      - name: map the NIM name
        run: echo "${{ secrets.NIM_HOST }} manager-server" | sudo tee -a /etc/hosts
      - name: verify templates match NIM
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
        run: python3 scripts/sync_templates.py --all --check
      - name: render, lint and test every template group
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_PASSWORD }}
          NIM_MGMT_ENDPOINT: ${{ secrets.NIM_MGMT_ENDPOINT }}
        run: |
          set -euo pipefail
          for g in $(./scripts/list-groups.sh template); do
            GROUP="$g" OUT_DIR="rendered/$g" CHECK_HASH=1 \
              HASH_FILE=.nim/rendered.lock.json ./scripts/render.sh
            ./scripts/lint.sh --rendered "$g"
            ./scripts/nginx-test-dir.sh "rendered/$g"
          done

  ci-gate:
    name: ci-gate
    needs: [checks, static, template]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.checks.result }}" = "success" ] || exit 1
          for r in "${{ needs.static.result }}" "${{ needs.template.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
