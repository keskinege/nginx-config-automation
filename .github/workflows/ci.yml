name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    outputs:
      static_changed: ${{ steps.changed.outputs.static }}
      template_changed: ${{ steps.changed.outputs.template }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-yq
      - run: pip install -r requirements-dev.txt
      - run: pytest
      - run: ./scripts/lint.sh
      - id: changed
        run: |
          set -euo pipefail
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          static=false
          template=false
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            static=true; template=true
          elif ! diff=$(git diff --name-only "$base" "$GITHUB_SHA"); then
            static=true; template=true
          else
            shared='^(scripts/|requirements-dev\.txt|pytest\.ini|\.github/)'
            if grep -qE "$shared" <<<"$diff"; then
              static=true
              template=true
            fi
            if grep -qE '^groups/' <<<"$diff"; then
              if changed=$(./scripts/detect-groups.sh static "$base" "$GITHUB_SHA" push); then
                [ "$changed" = "-" ] || static=true
              else
                echo "::error::static group detection failed"
                exit 2
              fi
            fi
            if grep -qE '^(templates/|\.nim/)' <<<"$diff"; then
              template=true
            elif grep -qE '^groups/' <<<"$diff"; then
              if changed=$(./scripts/detect-groups.sh template "$base" "$GITHUB_SHA" push); then
                [ "$changed" = "-" ] || template=true
              else
                echo "::error::template group detection failed"
                exit 2
              fi
            fi
          fi
          echo "static=$static" >> "$GITHUB_OUTPUT"
          echo "template=$template" >> "$GITHUB_OUTPUT"
      - name: actionlint
        run: |
          docker run --rm -v "$PWD:/repo" -w /repo \
            rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  static:
    name: static validation
    needs: checks
    if: needs.checks.outputs.static_changed == 'true'
    runs-on: ubuntu-latest
    environment: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup-yq
      - uses: ./.github/actions/setup-plus-registry
        with:
          crt: ${{ secrets.NGINX_REPO_CRT }}
          key: ${{ secrets.NGINX_REPO_KEY }}
      - run: ./scripts/nginx-test.sh
        env:
          NGINX_PLUS_JWT: ${{ secrets.NGINX_PLUS_JWT }}

  template:
    name: template validation
    needs: checks
    if: needs.checks.outputs.template_changed == 'true'
    runs-on: ubuntu-latest
    environment: validate
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-yq
      - run: pip install -r requirements-dev.txt
      - name: map the NIM name
        env:
          NIM_HOST: ${{ secrets.NIM_HOST }}
        run: echo "$NIM_HOST manager-server" | sudo tee -a /etc/hosts
      - id: prefix
        name: choose the template namespace
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "value=pr-${{ github.event.pull_request.number }}-" >> "$GITHUB_OUTPUT"
            # A prefixed namespace has its own template UIDs, and NIM names the
            # composed augment files after them, so the tree cannot equal a lock
            # built from the real UIDs. The lock is enforced at deploy instead.
            echo "hash=0" >> "$GITHUB_OUTPUT"
          else
            echo "value=" >> "$GITHUB_OUTPUT"
            echo "hash=1" >> "$GITHUB_OUTPUT"
          fi

      - name: verify templates match NIM
        if: steps.prefix.outputs.value == ''
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_VALIDATOR_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_VALIDATOR_PASSWORD }}
        run: python3 scripts/sync_templates.py --all --check
      - name: publish this PR's templates under a throwaway prefix
        if: steps.prefix.outputs.value != ''
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_TEMPLATE_WRITER_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_TEMPLATE_WRITER_PASSWORD }}
          TEMPLATE_PREFIX: ${{ steps.prefix.outputs.value }}
        run: python3 scripts/sync_templates.py --all

      - uses: ./.github/actions/setup-plus-registry
        with:
          crt: ${{ secrets.NGINX_REPO_CRT }}
          key: ${{ secrets.NGINX_REPO_KEY }}
      - name: render, lint and test every template group
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_VALIDATOR_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_VALIDATOR_PASSWORD }}
          NIM_MGMT_ENDPOINT: ${{ secrets.NIM_MGMT_ENDPOINT }}
          NGINX_PLUS_JWT: ${{ secrets.NGINX_PLUS_JWT }}
          TEMPLATE_PREFIX: ${{ steps.prefix.outputs.value }}
        run: |
          set -euo pipefail
          for g in $(./scripts/list-groups.sh template); do
            GROUP="$g" OUT_DIR="rendered/$g" CHECK_HASH="${{ steps.prefix.outputs.hash }}" \
              HASH_FILE=.nim/rendered.lock.json ./scripts/render.sh
            ./scripts/lint.sh --rendered "$g"
            ./scripts/nginx-test-dir.sh "rendered/$g"
          done

      - name: delete this PR's templates
        if: always() && steps.prefix.outputs.value != ''
        env:
          NIM_URL: ${{ secrets.NIM_URL }}
          NIM_HOST: ${{ secrets.NIM_HOST }}
          NIM_USER: ${{ secrets.NIM_TEMPLATE_WRITER_USER }}
          NIM_PASSWORD: ${{ secrets.NIM_TEMPLATE_WRITER_PASSWORD }}
          TEMPLATE_PREFIX: ${{ steps.prefix.outputs.value }}
        run: python3 scripts/sync_templates.py --delete-prefix "$TEMPLATE_PREFIX"

  ci-gate:
    name: ci-gate
    needs: [checks, static, template]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: |
          [ "${{ needs.checks.result }}" = "success" ] || exit 1
          for r in "${{ needs.static.result }}" "${{ needs.template.result }}"; do
            case "$r" in
              success|skipped) ;;
              *) exit 1 ;;
            esac
          done
