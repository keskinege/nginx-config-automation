name: setup yq
description: Install mikefarah yq v4.54.3 with a checksum
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        curl -fsSL -o /tmp/yq \
          https://github.com/mikefarah/yq/releases/download/v4.54.3/yq_linux_amd64
        echo "129534601871538efe0ba4c5e62a34fb1d5f469bcb975c4fddeb467d82974973  /tmp/yq" \
          | sha256sum -c -
        sudo install -m 0755 /tmp/yq /usr/local/bin/yq
