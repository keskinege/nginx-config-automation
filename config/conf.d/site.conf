server {
    listen 80 default_server;
    server_name _;

    location / {
        return 200 "published by gitops (plus-docker-nginx-config)";
        add_header Content-Type text/plain;
    }

    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }
}

