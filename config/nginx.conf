user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    access_log    /var/log/nginx/access.log;
    sendfile      on;
    keepalive_timeout 65;

    # Pulls in conf.d/site.conf from this repo AND the Plus API listener that
    # ships inside the image (plus-api.conf on 127.0.0.1:9000). Do not remove:
    # without it the NGINX Agent loses Plus metrics and live activity.
    include /etc/nginx/conf.d/*.conf;
}

# Usage reporting to the OVH-FR instance manager. `mgmt` is a MAIN-context block
# (a sibling of events/http, not an http directive). A publish that drops this
# block makes the instance disappear from NIM.
mgmt {
    usage_report endpoint=nim-mgmt-endpoint.invalid;
    enforce_initial_report off;
    ssl_verify off;
}
